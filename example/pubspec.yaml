name: fjs_example
description: "A modern Material Design 3 demonstration of the FJS JavaScript runtime for Flutter."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.1.0+1

environment:
  sdk: ">=3.3.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  fjs:
    path: ../

  cupertino_icons: ^1.0.8

  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  provider: ^6.1.2

  shared_preferences: ^2.2.3

  path_provider: ^2.1.3
  file_picker: ^8.0.5

  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/examples/

dependency_overrides:
  flutter_rust_bridge:
    path: ../flutter_rust_bridge_patched
  freezed_annotation: ^2.4.1
  freezed: ^2.4.0
  ffigen: ^10.0.0
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0